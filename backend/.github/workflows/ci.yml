name: CI — Laravel Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: PHP ${{ matrix.php }} — Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # 2. Setup PHP (no need for a committed composer.phar)
      # -------------------------------------------------------------------------
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, bcmath, xml, json, tokenizer, dom
          coverage: none

      # -------------------------------------------------------------------------
      # [MÉDIO 6] 3. Install Composer via official installer (not from repo .phar)
      #              The installer verifies the SHA-384 hash before executing.
      # -------------------------------------------------------------------------
      - name: Install Composer via official installer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-installer.php');"
          php -r "
            \$expected = trim(file_get_contents('https://composer.github.io/installer.sig'));
            \$actual   = hash_file('sha384', 'composer-installer.php');
            if (\$expected !== \$actual) {
              echo 'Installer corrupt — hash mismatch' . PHP_EOL;
              exit(1);
            }
          "
          php composer-installer.php --install-dir=/usr/local/bin --filename=composer
          rm composer-installer.php

      # -------------------------------------------------------------------------
      # 4. Cache Composer vendor directory (keyed on composer.lock)
      # -------------------------------------------------------------------------
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        id: composer-cache
        with:
          path: backend/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php }}-
            composer-

      # -------------------------------------------------------------------------
      # 5. Install PHP dependencies
      # -------------------------------------------------------------------------
      - name: Install PHP dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # -------------------------------------------------------------------------
      # 6. Environment setup
      # -------------------------------------------------------------------------
      - name: Copy .env for CI
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # -------------------------------------------------------------------------
      # 7. Run database migrations
      # -------------------------------------------------------------------------
      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: secret

      # -------------------------------------------------------------------------
      # 8. Run PHPUnit test suite
      # -------------------------------------------------------------------------
      - name: Run tests
        run: php artisan test --parallel
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: secret

  # ---------------------------------------------------------------------------
  # Code style check (non-blocking on PRs, blocking on main)
  # ---------------------------------------------------------------------------
  lint:
    name: Laravel Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-installer.php');"
          php composer-installer.php --install-dir=/usr/local/bin --filename=composer
          rm composer-installer.php
        working-directory: backend
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: pint-${{ hashFiles('backend/composer.lock') }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - name: Run Pint (dry-run)
        run: ./vendor/bin/pint --test
        working-directory: backend
